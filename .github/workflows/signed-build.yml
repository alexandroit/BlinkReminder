name: Manually authorized signed EXE build
on:
  workflow_dispatch:
    inputs:
      authorize_signing:
        description: Sign a direct-distribution EXE using the protected environment certificate
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  sign:
    if: inputs.authorize_signing && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and validate
        run: |
          ./build/Generate-Assets.ps1
          ./build/Restore.ps1
          ./build/Build.ps1
          ./build/Test.ps1
          ./build/Publish.ps1
          ./build/Install-InnoSetup.ps1
      - name: Import certificate temporarily and sign
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:TIMESTAMP_URL) {
            throw 'Configure certificate secrets and TIMESTAMP_URL in the protected release-signing environment.'
          }
          $path = Join-Path $env:RUNNER_TEMP "$([Guid]::NewGuid()).pfx"
          $certificates = @()
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:/CurrentUser/My -Password $password)
            $signer = @($certificates | Where-Object HasPrivateKey)
            if ($signer.Count -ne 1) { throw 'Expected exactly one signing certificate with a private key.' }
            ./build/Sign-DirectRelease.ps1 -CertificateThumbprint $signer[0].Thumbprint -TimestampUrl $env:TIMESTAMP_URL
            ./build/Write-ArtifactManifest.ps1
          } finally {
            Remove-Item $path -Force -ErrorAction SilentlyContinue
            foreach ($certificate in $certificates) {
              Remove-Item "Cert:/CurrentUser/My/$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue
            }
          }
      - name: Upload signed artifacts for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlinkReminder-win-x64-signed-${{ github.sha }}
          path: artifacts/installers/*
          if-no-files-found: error
          retention-days: 14
